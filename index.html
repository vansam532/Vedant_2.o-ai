<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#101426">
  <meta name="description" content="VEDANT AI — Learn · Create · Grow">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VEDANT AI">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <title>VEDANT AI — Learn · Create · Grow</title>
</head>

<body>
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
          .then(() => console.log("VEDANT AI PWA Ready"))
          .catch(error => console.error("PWA Error:", error));
      });
    }
  </script>
</body>
</html>
